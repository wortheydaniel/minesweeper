# NOTE: written alongside the code but not yet run on GitHub. Check the first run.
name: ci
on: [push, pull_request]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format
        if: matrix.os == 'ubuntu-latest'
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
      - name: Dependency rules
        if: matrix.os == 'ubuntu-latest'
        run: go run ./tools/checkdeps
      - name: Cross-build all targets
        if: matrix.os == 'ubuntu-latest'
        run: go run ./tools/build
      - name: Window smoke test (virtual X server)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1 libgl1-mesa-dri libx11-6 libxcursor1 libxrandr2 libxinerama1 libxi6 libxxf86vm1
          CGO_ENABLED=0 go build -o minesweeper ./cmd/minesweeper
          xvfb-run -a ./minesweeper --smoke --data-dir "$RUNNER_TEMP/ms"
